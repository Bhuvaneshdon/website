<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="bhuvi" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
background-size:400% 400%;
animation:bgMove 10s infinite alternate;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

.container{
text-align:center;
z-index:2;
padding:20px;
}

h1{
font-size:60px;
color:white;
text-shadow:0 0 20px #ff0080;
animation:zoom 2s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

p{
font-size:22px;
color:white;
margin:20px;
}

button{
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
background:#ff1493;
color:white;
cursor:pointer;
transition:.3s;
box-shadow:0 0 15px white;
}

button:hover{
transform:scale(1.1);
background:#ff0080;
}

#surprise{
display:none;
margin-top:30px;
font-size:28px;
color:white;
animation:fadeIn 2s;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.balloon{
position:absolute;
bottom:-150px;
width:70px;
height:90px;
border-radius:50%;
animation:float 12s linear infinite;
}

.balloon::after{
content:"";
position:absolute;
left:34px;
top:90px;
width:2px;
height:80px;
background:white;
}

@keyframes float{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-120vh);
}
}

.sparkle{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
0%,100%{
opacity:0;
transform:scale(.5);
}
50%{
opacity:1;
transform:scale(1.8);
}
}
</style>

</head>

<body>

<div class="container">

<h1>🎂 Happy Birthday! 🎉</h1>

<p>Today is all about celebrating YOU! ❤️</p>

<button onclick="showSurprise()">
🎁 Open Your Surprise
</button>

<div id="surprise">

<h2>🎉 Surprise! 🎉</h2>

<p>
Wishing you endless happiness, good health,
success, and beautiful memories.
May all your dreams come true! 💖
</p>

<h1>🎂🎈🥳</h1>

</div>

</div>

<!-- Balloons -->
<div class="balloon" style="left:5%;background:red;animation-delay:0s;"></div>
<div class="balloon" style="left:20%;background:blue;animation-delay:2s;"></div>
<div class="balloon" style="left:35%;background:yellow;animation-delay:5s;"></div>
<div class="balloon" style="left:50%;background:green;animation-delay:3s;"></div>
<div class="balloon" style="left:65%;background:purple;animation-delay:1s;"></div>
<div class="balloon" style="left:80%;background:orange;animation-delay:4s;"></div>
<div class="balloon" style="left:95%;background:pink;animation-delay:6s;"></div>

<script>

function showSurprise(){

document.getElementById("surprise").style.display="block";

confetti();

}

function confetti(){

for(let i=0;i<150;i++){

let c=document.createElement("div");

c.style.position="absolute";

c.style.width="10px";

c.style.height="10px";

c.style.background=`hsl(${Math.random()*360},100%,50%)`;

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.borderRadius="50%";

c.style.transition="4s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.top="100vh";

c.style.transform=`rotate(${Math.random()*720}deg)`;

},50);

setTimeout(()=>{

c.remove();

},4500);

}

}

// Sparkles
for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"vw";

s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}

</script>

<!-- Optional Background Music -->
<!--
<audio autoplay loop>
<source src="birthday.mp3" type="audio/mpeg">
</audio>
-->

</body>
</html>
