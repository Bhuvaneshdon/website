<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff6ec4,#7873f5);
    overflow:hidden;
}

.container{
    text-align:center;
}

button{
    padding:18px 40px;
    font-size:22px;
    border:none;
    border-radius:50px;
    background:#ff1493;
    color:white;
    cursor:pointer;
    box-shadow:0 0 20px rgba(255,255,255,.6);
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

#message{
    display:none;
    animation:fadeIn 1.5s ease;
}

h1{
    color:white;
    font-size:60px;
    text-shadow:0 0 20px white;
}

h2{
    color:#fff;
    font-size:40px;
    margin-top:20px;
}

p{
    color:white;
    font-size:22px;
    margin-top:15px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Floating Balloons */
.balloon{
    position:absolute;
    bottom:-120px;
    width:60px;
    height:80px;
    border-radius:50%;
    animation:float 10s linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    left:29px;
    top:80px;
    width:2px;
    height:70px;
    background:white;
}

@keyframes float{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}
</style>
</head>

<body>

<div class="container">

<button onclick="openGift()">🎁 Open Surprise</button>

<div id="message">
    <h1>🎉 HAPPY BIRTHDAY 🎉</h1>
    <h2>🎂 Bhuvi 🎂</h2>
    <p>Wishing you happiness, success, good health,<br>
    and endless smiles. Have an amazing birthday! ❤️</p>
</div>

</div>

<div class="balloon" style="left:10%;background:red;"></div>
<div class="balloon" style="left:30%;background:yellow;animation-delay:2s;"></div>
<div class="balloon" style="left:50%;background:blue;animation-delay:4s;"></div>
<div class="balloon" style="left:70%;background:green;animation-delay:1s;"></div>
<div class="balloon" style="left:90%;background:pink;animation-delay:3s;"></div>

<script>
function openGift(){

    document.querySelector("button").style.display="none";
    document.getElementById("message").style.display="block";

    for(let i=0;i<120;i++){

        let confetti=document.createElement("div");

        confetti.style.position="absolute";
        confetti.style.width="10px";
        confetti.style.height="10px";
        confetti.style.borderRadius="50%";
        confetti.style.left=Math.random()*100+"vw";
        confetti.style.top="-20px";
        confetti.style.background=`hsl(${Math.random()*360},100%,50%)`;
        confetti.style.transition="4s linear";

        document.body.appendChild(confetti);

        setTimeout(()=>{
            confetti.style.top="100vh";
            confetti.style.transform=`rotate(${Math.random()*720}deg)`;
        },10);

        setTimeout(()=>{
            confetti.remove();
        },4000);
    }
}
</script>

</body>
</html>
